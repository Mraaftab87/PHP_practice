<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job application</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="form-card">
        <h2>Job Application Details</h2>
        <form id="jobForm">
            <div class="form-group">
                <label>Job Title</label>
                <input type="text" name="job_title" placeholder="Enter the Job Title" required>
            </div>
            <div class="form-group">
                <label>Job Description</label>
                <textarea name="job_description" placeholder="Description"></textarea>
            </div>
            <div class="row">
                <div class="col">
                    <label>Job Type</label>
                    <select name="job_type" required>
                        <option value="">Select Job Type</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Part-time">Part-time</option>
                        <option value="Contract">Contract</option>
                        <option value="Freelance">Freelance</option>
                        <option value="Internship">Internship</option>
                    </select>
                </div>
                <div class="col">
                    <label>Years of experience</label>
                    <input type="text" name="experience" placeholder="e.g. 1 or +1 years" required>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label>Career level</label>
                    <input type="text" name="career_level" placeholder="e.g. Manager" required>
                </div>
                <div class="col">
                    <label>Salary</label>
                    <input type="text" name="salary" placeholder="e.g. $65,000-$70,000" required>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label>Recruiter</label>
                    <input type="text" name="recruiter" placeholder="e.g. Curtis Monroe" required>
                </div>
                <div class="col">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="e.g. curtis@hprosearch.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Categories</label>
                <select name="category" required>
                    <option value="">Select Category</option>
                    <option value="Resorts">Resorts</option>
                    <option value="All">All</option>
                    <option value="Fast Casual">Fast Casual</option>
                    <option value="Fine Dining">Fine Dining</option>
                    <option value="Italian">Italian</option>
                    <option value="Mexican">Mexican</option>
                    <option value="Seafood">Seafood</option>
                    <option value="Sports Bar">Sports Bar</option>
                </select>
            </div>
            <div class="row">
                <div class="col">
                    <label>State</label>
                    <select name="state" required>
                        <option value="">Seletct State</option>
                        <option value="Gujarat">Gujarat</option>
                        <option value="Rajastahan">Rajastahan</option>
                        <option value="Maharashtra">Maharashtra</option>
                    </select>
                </div>
                <div class="col">
                    <label>City</label>
                    <select name="city" required>
                        <option value="">Select City</option>
                        <option value="Rajkot">Rajkot</option>
                        <option value="Ahmedabad">Ahmedabad</option>
                        <option value="Mumbai">Mumbai</option>
                    </select>
                </div>
            </div>
            <button type="submit">Submit</button>
            <div id="message"></div>
        </form>
    </div>
    <script>
        $(document).ready(function () {
            $('#jobForm').on('submit', function (e) {
                e.preventDefault();

                $.ajax({
                    type: 'POST',
                    url: 'process_job.php',
                    data: $(this).serialize(),
                    success: function (response) {
                        if (response.trim() == "success") {
                            $('#message').html('<span style="color: green;">Job details saved successfully!</span>');
                            $('#jobForm')[0].reset();
                        } else {
                            $('#message').html('<span style="color: red;">Error: ' + response + '</span>');
                        }
                    },
                    error: function () {
                        $('#message').html('<span style="color: red;">Something went wrong!</span>');
                    }
                });
            });
        });
    </script>
</body>

</html>
